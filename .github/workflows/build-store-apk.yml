name: White-Label Store APK Builder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "UUID row in public.store_app_builds"
        required: true
        type: string
      store_id:
        description: "Tenant store UUID"
        required: true
        type: string
      store_slug:
        description: "Tenant store URL slug"
        required: true
        type: string
      app_name:
        description: "Android launcher display name"
        required: true
        type: string
      app_id_suffix:
        description: "Application ID suffix (e.g. .myshop)"
        required: true
        type: string
      icon_url:
        description: "Optional HTTPS app icon URL (PNG/JPG/WEBP)"
        required: false
        default: ""
        type: string
      version_code:
        description: "Build versionCode (integer >= 1)"
        required: false
        default: "1"
        type: string
      version_name:
        description: "Build versionName (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: store-apk-build-${{ inputs.store_id }}
  cancel-in-progress: false

jobs:
  build-store-apk:
    name: Build White-Label APK (${{ inputs.store_slug }})
    runs-on: ubuntu-latest

    steps:
      - name: Validate workflow inputs strictly
        env:
          BUILD_ID: ${{ inputs.build_id }}
          STORE_ID: ${{ inputs.store_id }}
          STORE_SLUG: ${{ inputs.store_slug }}
          APP_NAME: ${{ inputs.app_name }}
          APP_ID_SUFFIX: ${{ inputs.app_id_suffix }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          python3 - << 'PY'
          import os, re, sys

          uuid_re = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", re.I)
          slug_re = re.compile(r"^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$")
          suffix_re = re.compile(r"^\.[a-z][a-z0-9_]{0,29}$")
          vcode_re = re.compile(r"^[1-9][0-9]{0,8}$")
          vname_re = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?$", re.I)

          build_id = os.environ["BUILD_ID"].strip()
          store_id = os.environ["STORE_ID"].strip()
          store_slug = os.environ["STORE_SLUG"].strip()
          app_name = os.environ["APP_NAME"].strip()
          app_suffix = os.environ["APP_ID_SUFFIX"].strip()
          version_code = os.environ["VERSION_CODE"].strip()
          version_name = os.environ["VERSION_NAME"].strip()

          if not uuid_re.match(build_id):
              sys.exit("::error::Invalid build_id UUID.")
          if not uuid_re.match(store_id):
              sys.exit("::error::Invalid store_id UUID.")
          if not slug_re.match(store_slug):
              sys.exit("::error::Invalid store_slug.")
          if not suffix_re.match(app_suffix):
              sys.exit("::error::Invalid app_id_suffix.")
          if not vcode_re.match(version_code):
              sys.exit("::error::Invalid version_code.")
          if not vname_re.match(version_name):
              sys.exit("::error::Invalid version_name.")

          # Strip controls/newlines, but keep the raw Unicode label. Android's
          # manifest merger performs XML escaping exactly once when it writes
          # the placeholder into AndroidManifest.xml.
          clean_name = re.sub(r"[\x00-\x1f\x7f]+", " ", app_name).strip()[:60]
          if len(clean_name) < 2:
              sys.exit("::error::Invalid app_name.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SAFE_BUILD_ID={build_id}\n")
              fh.write(f"SAFE_STORE_ID={store_id}\n")
              fh.write(f"SAFE_STORE_SLUG={store_slug}\n")
              fh.write(f"SAFE_APP_NAME={clean_name}\n")
              fh.write(f"SAFE_APP_ID_SUFFIX={app_suffix}\n")
              fh.write(f"SAFE_VERSION_CODE={version_code}\n")
              fh.write(f"SAFE_VERSION_NAME={version_name}\n")
          print("All workflow inputs validated cleanly.")
          PY

      - name: Mark build as building in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ env.SAFE_BUILD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret missing; skipping status PATCH."
            exit 0
          fi
          python3 - << 'PY'
          import datetime, json, os, re, sys, urllib.parse, urllib.request
          build_id = os.environ["BUILD_ID"].strip()
          if not re.match(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", build_id, re.I):
              sys.exit("::error::Invalid BUILD_ID UUID.")
          now_iso = datetime.datetime.now(datetime.timezone.utc).isoformat()
          query = urllib.parse.urlencode({"id": f"eq.{build_id}"})
          url = f"{os.environ['SUPABASE_URL'].rstrip('/')}/rest/v1/store_app_builds?{query}"
          payload = json.dumps({
              "status": "building",
              "github_run_url": os.environ["RUN_URL"],
              "error_message": None,
              "updated_at": now_iso,
          }).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              method="PATCH",
              headers={
                  "apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Authorization": f"Bearer {os.environ['SUPABASE_SERVICE_ROLE_KEY']}",
                  "Content-Type": "application/json",
                  "Prefer": "return=minimal",
                  "User-Agent": "WhiteLabelCommerce-CI/1.0",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("Marked build as building:", resp.status)
          PY

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Android push for registered Firebase packages
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android-app/app/google-services.json
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Decode permanent release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/release.keystore
          echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"

      - name: Prepare custom launcher icon (optional)
        env:
          ICON_URL: ${{ inputs.icon_url }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          STORE_ID: ${{ env.SAFE_STORE_ID }}
        run: |
          if [ -z "$ICON_URL" ]; then
            echo "No custom icon URL provided; using default launcher icon."
            exit 0
          fi
          python3 -m pip install --quiet pillow || true
          python3 - << 'PY'
          import io, os, urllib.parse, urllib.request
          url = os.environ.get("ICON_URL", "").strip()
          supabase_url = os.environ.get("SUPABASE_URL", "").strip()
          store_id = os.environ.get("STORE_ID", "").strip()

          parsed_icon = urllib.parse.urlparse(url)
          parsed_sb = urllib.parse.urlparse(supabase_url)
          allowed_host = (parsed_sb.hostname or "").lower()
          icon_host = (parsed_icon.hostname or "").lower()
          expected_prefix = f"/storage/v1/object/public/product-images/app-icons/{store_id}/"

          if (
              parsed_icon.scheme != "https"
              or not allowed_host
              or icon_host != allowed_host
              or ".." in parsed_icon.path
              or not parsed_icon.path.startswith(expected_prefix)
          ):
              print("::warning::Skipping icon URL outside the project's Supabase Storage bucket for this store.")
              raise SystemExit(0)

          MAX_BYTES = 3 * 1024 * 1024  # 3 MB hard cap
          try:
              from PIL import Image
              Image.MAX_IMAGE_PIXELS = 16_000_000

              req = urllib.request.Request(url, headers={"User-Agent": "WhiteLabelCommerce-Builder/1.0"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = resp.read(MAX_BYTES + 1)
                  if len(data) > MAX_BYTES:
                      raise ValueError("Icon exceeds 3 MB maximum size.")
              img = Image.open(io.BytesIO(data)).convert("RGBA")
              # Center-crop to square
              side = min(img.width, img.height)
              left = (img.width - side) // 2
              top = (img.height - side) // 2
              img = img.crop((left, top, left + side, top + side))

              densities = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              res_root = "android-app/app/src/main/res"
              # Remove adaptive XML overrides so PNG launcher icons take effect cleanly
              for xml_name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  xml_path = os.path.join(res_root, "mipmap-anydpi-v26", xml_name)
                  if os.path.exists(xml_path):
                      os.remove(xml_path)
              for folder, px in densities.items():
                  out_dir = os.path.join(res_root, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((px, px), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
                  resized.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")
              print("Applied custom merchant launcher icon across all mipmap densities.")
          except Exception as e:
              print(f"::warning::Failed to apply custom icon (falling back to default): {e}")
          PY

      - name: Build Signed White-Label Tenant APK
        working-directory: android-app
        env:
          CI: "true"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EMAIL_PASSWORD_RESET_ENABLED: ${{ vars.EMAIL_PASSWORD_RESET_ENABLED || 'false' }}
          WEB_STORE_BASE_URL: ${{ secrets.WEB_STORE_BASE_URL || vars.WEB_STORE_BASE_URL }}
          STORE_ID_INPUT: ${{ env.SAFE_STORE_ID }}
          STORE_SLUG_INPUT: ${{ env.SAFE_STORE_SLUG }}
          APP_NAME_INPUT: ${{ env.SAFE_APP_NAME }}
          APP_SUFFIX_INPUT: ${{ env.SAFE_APP_ID_SUFFIX }}
          VERSION_CODE_INPUT: ${{ env.SAFE_VERSION_CODE }}
          VERSION_NAME_INPUT: ${{ env.SAFE_VERSION_NAME }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease \
            -PstoreId="$STORE_ID_INPUT" \
            -PstoreSlug="$STORE_SLUG_INPUT" \
            -PstoreName="$APP_NAME_INPUT" \
            -PappIdSuffix="$APP_SUFFIX_INPUT" \
            -PVERSION_CODE="$VERSION_CODE_INPUT" \
            -PVERSION_NAME="$VERSION_NAME_INPUT" \
            --no-daemon

      - name: Package & verify signed white-label APK
        env:
          STORE_SLUG: ${{ env.SAFE_STORE_SLUG }}
          VERSION_CODE_INPUT: ${{ env.SAFE_VERSION_CODE }}
          VERSION_NAME_INPUT: ${{ env.SAFE_VERSION_NAME }}
        run: |
          APK_SOURCE=$(find android-app/app/build/outputs/apk/github/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "::error::No release APK generated."
            exit 1
          fi
          mkdir -p dist
          APK_FILENAME="${STORE_SLUG}-v${VERSION_NAME_INPUT}-b${VERSION_CODE_INPUT}-release.apk"
          RELEASE_APK="dist/${APK_FILENAME}"
          cp "$APK_SOURCE" "$RELEASE_APK"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"
          RELEASE_TAG="store-${STORE_SLUG}-b${VERSION_CODE_INPUT}"
          echo "RELEASE_APK=${RELEASE_APK}" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$RELEASE_APK" | cut -d" " -f1)" >> "$GITHUB_ENV"
          echo "APK_FILENAME=${APK_FILENAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_APK"

      - name: Publish isolated prerelease (NEVER overwrites main Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.SAFE_APP_NAME }} (${{ env.SAFE_STORE_SLUG }}) v${{ env.SAFE_VERSION_NAME }} #${{ env.SAFE_VERSION_CODE }}"
          prerelease: true
          make_latest: false
          files: |
            ${{ env.RELEASE_APK }}

      - name: Mark build succeeded in Supabase
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ env.SAFE_BUILD_ID }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.APK_FILENAME }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            exit 1
          fi
          python3 - << 'PY'
          import datetime, json, os, re, sys, urllib.parse, urllib.request
          build_id = os.environ["BUILD_ID"].strip()
          if not re.match(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", build_id, re.I):
              sys.exit("::error::Invalid BUILD_ID UUID.")
          now_iso = datetime.datetime.now(datetime.timezone.utc).isoformat()
          query = urllib.parse.urlencode({"id": f"eq.{build_id}"})
          url = f"{os.environ['SUPABASE_URL'].rstrip('/')}/rest/v1/store_app_builds?{query}"
          payload = json.dumps({
              "status": "succeeded",
              "sha256": os.environ["APK_SHA256"],
              "apk_download_url": os.environ["DOWNLOAD_URL"],
              "error_message": None,
              "updated_at": now_iso,
              "completed_at": now_iso,
          }).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              method="PATCH",
              headers={
                  "apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Authorization": f"Bearer {os.environ['SUPABASE_SERVICE_ROLE_KEY']}",
                  "Content-Type": "application/json",
                  "Prefer": "return=representation",
                  "User-Agent": "WhiteLabelCommerce-CI/1.0",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              rows = json.load(resp)
              if len(rows) != 1 or rows[0].get("sha256") != os.environ["APK_SHA256"]:
                  sys.exit("::error::Build metadata was not persisted.")
              print("Recorded signed APK and checksum.")
          PY

      - name: Mark build failed in Supabase
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ env.SAFE_BUILD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            exit 0
          fi
          python3 - << 'PY'
          import datetime, json, os, re, sys, urllib.parse, urllib.request
          build_id = os.environ["BUILD_ID"].strip()
          if not re.match(r"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", build_id, re.I):
              sys.exit("::error::Invalid BUILD_ID UUID.")
          now_iso = datetime.datetime.now(datetime.timezone.utc).isoformat()
          query = urllib.parse.urlencode({"id": f"eq.{build_id}"})
          url = f"{os.environ['SUPABASE_URL'].rstrip('/')}/rest/v1/store_app_builds?{query}"
          payload = json.dumps({
              "status": "failed",
              "github_run_url": os.environ["RUN_URL"],
              "error_message": "APK build failed in GitHub Actions. Check run logs for details.",
              "updated_at": now_iso,
              "completed_at": now_iso,
          }).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              method="PATCH",
              headers={
                  "apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  "Authorization": f"Bearer {os.environ['SUPABASE_SERVICE_ROLE_KEY']}",
                  "Content-Type": "application/json",
                  "Prefer": "return=minimal",
                  "User-Agent": "WhiteLabelCommerce-CI/1.0",
              },
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("Marked build failed:", resp.status)
          PY
