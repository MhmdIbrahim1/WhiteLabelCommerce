name: Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Signed APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using pre-installed Android SDK at $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "Decoded release keystore to android-app/release.keystore"
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set; falling back to debug signing."
          fi

      - name: Compute version metadata
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 10 ))
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Building versionName=${VERSION_NAME} (versionCode=${VERSION_CODE})"

      - name: Build Android Release APK
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPO: ${{ github.repository }}
          ENABLE_GITHUB_UPDATER: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STORE_ID: ${{ vars.STORE_ID }}
          WEB_STORE_BASE_URL: ${{ vars.WEB_STORE_BASE_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            --no-daemon

      - name: Prepare release APK asset
        run: |
          APK_SOURCE=$(find android-app/app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "No release APK found!"
            exit 1
          fi
          mkdir -p dist
          RELEASE_APK="dist/WhiteLabelCommerce-v${VERSION_NAME}-release.apk"
          cp "$APK_SOURCE" "$RELEASE_APK"
          echo "RELEASE_APK=${RELEASE_APK}" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: WhiteLabelCommerce v${{ env.VERSION_NAME }}
          generate_release_notes: true
          make_latest: true
          files: ${{ env.RELEASE_APK }}
