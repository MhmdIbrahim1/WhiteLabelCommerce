name: Android Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-publish
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Signed APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using pre-installed Android SDK at $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Decode permanent release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for CI release builds."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/release.keystore
          if [ ! -s android-app/release.keystore ]; then
            echo "::error::Decoded android-app/release.keystore is empty."
            exit 1
          fi
          echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
          echo "Decoded permanent release keystore to android-app/release.keystore"

      - name: Decode Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android-app/app/google-services.json
            if [ ! -s android-app/app/google-services.json ]; then
              echo "::error::Decoded android-app/app/google-services.json is empty."
              exit 1
            fi
            echo "Decoded Firebase google-services.json for FCM push support."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret is not set; building without google-services.json."
          fi

      - name: Resolve and validate version metadata (Single Source of Truth)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - << 'PY'
          import json, os, re, sys, urllib.request

          gradle_path = "android-app/app/build.gradle.kts"
          with open(gradle_path, "r", encoding="utf-8") as f:
              text = f.read()

          vc_match = re.search(r"val\s+defaultVersionCode\s*=\s*(\d+)", text)
          vn_match = re.search(r'val\s+defaultVersionName\s*=\s*"([^"]+)"', text)
          if not vc_match or not vn_match:
              sys.exit("::error::Could not parse defaultVersionCode / defaultVersionName from android-app/app/build.gradle.kts")

          version_code = int(vc_match.group(1))
          version_name = vn_match.group(1).strip()

          if not re.match(r"^\d+\.\d+\.\d+$", version_name):
              sys.exit(f"::error::defaultVersionName '{version_name}' must be semantic X.Y.Z")

          ref = os.environ.get("GITHUB_REF", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("refs/tags/v"):
              tag_version = ref_name[1:]
              if tag_version != version_name:
                  sys.exit(
                      f"::error::Tag v{tag_version} does not match defaultVersionName '{version_name}' in {gradle_path}. "
                      "Keep build.gradle.kts and the Git release tag strictly synchronized."
                  )

          target_tag = f"v{version_name}"

          # Monotonic versionCode guard against all other published GitHub Releases
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          highest_other_code = 0
          highest_other_tag = ""
          if repo:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=20",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "WhiteLabelCommerce-CI",
                      **({"Authorization": f"Bearer {token}"} if token else {}),
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      releases = json.loads(resp.read().decode("utf-8"))
                  for rel in releases:
                      if rel.get("draft") or rel.get("prerelease"):
                          continue
                      rtag = rel.get("tag_name", "")
                      if rtag == target_tag:
                          continue
                      for asset in rel.get("assets", []):
                          if asset.get("name", "").lower() == "release-meta.json":
                              meta_url = asset.get("browser_download_url", "")
                              if meta_url:
                                  try:
                                      mreq = urllib.request.Request(meta_url, headers={"User-Agent": "WhiteLabelCommerce-CI"})
                                      with urllib.request.urlopen(mreq, timeout=10) as mresp:
                                          meta = json.loads(mresp.read().decode("utf-8"))
                                      code = int(meta.get("versionCode") or 0)
                                      if code > highest_other_code:
                                          highest_other_code = code
                                          highest_other_tag = rtag
                                  except Exception:
                                      pass
                              break
              except Exception as e:
                  print(f"::warning::Could not query existing releases for monotonic guard: {e}")

          if highest_other_code > 0 and version_code <= highest_other_code:
              sys.exit(
                  f"::error::defaultVersionCode={version_code} is NOT strictly greater than existing release "
                  f"{highest_other_tag} (versionCode={highest_other_code}). Bump defaultVersionCode in {gradle_path}."
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envf:
              envf.write(f"VERSION_CODE={version_code}\n")
              envf.write(f"VERSION_NAME={version_name}\n")

          print(f"Resolved single-source-of-truth release: tag={target_tag}, versionName={version_name}, versionCode={version_code} (previous max={highest_other_code} from {highest_other_tag or 'none'})")
          PY

      - name: Build Android GitHub-Flavor Release APK
        working-directory: android-app
        env:
          CI: "true"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STORE_ID: ${{ vars.STORE_ID }}
          STORE_SLUG: ${{ vars.STORE_SLUG || ((!vars.STORE_ID || vars.STORE_ID == '00000000-0000-0000-0000-000000000001') && 'nova-store') || '' }}
          EMAIL_PASSWORD_RESET_ENABLED: ${{ vars.EMAIL_PASSWORD_RESET_ENABLED || 'false' }}
          WEB_STORE_BASE_URL: ${{ secrets.WEB_STORE_BASE_URL || vars.WEB_STORE_BASE_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            --no-daemon

      - name: Verify APK signature & generate release-meta.json
        run: |
          APK_SOURCE=$(find android-app/app/build/outputs/apk/github/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "::error::No githubRelease APK found!"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "Verifying APK signature with $APKSIGNER..."
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_SOURCE")
          echo "$CERT_OUTPUT"

          if echo "$CERT_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with Android Debug keystore! Refusing to publish."
            exit 1
          fi
          if ! echo "$CERT_OUTPUT" | grep -Eq "CN=(WhiteLabelCommerce|NovaStore)"; then
            echo "::error::APK signer certificate does not match expected permanent release certificate."
            exit 1
          fi

          mkdir -p dist
          APK_FILENAME="WhiteLabelCommerce-v${VERSION_NAME}-release.apk"
          RELEASE_APK="dist/${APK_FILENAME}"
          cp "$APK_SOURCE" "$RELEASE_APK"

          APK_SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          COMMIT_NOTES=$(git log -1 --pretty=%s)

          python3 - "$VERSION_CODE" "$VERSION_NAME" "$APK_FILENAME" "$APK_SHA256" "$COMMIT_NOTES" << 'PY' > dist/release-meta.json
          import json, sys
          meta = {
              "versionCode": int(sys.argv[1]),
              "versionName": sys.argv[2],
              "apkName": sys.argv[3],
              "sha256": sys.argv[4],
              "notes": sys.argv[5],
          }
          print(json.dumps(meta, indent=2, ensure_ascii=False))
          PY

          cat dist/release-meta.json
          echo "RELEASE_APK=${RELEASE_APK}" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_APK" dist/release-meta.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: WhiteLabelCommerce v${{ env.VERSION_NAME }}
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ env.RELEASE_APK }}
            dist/release-meta.json
