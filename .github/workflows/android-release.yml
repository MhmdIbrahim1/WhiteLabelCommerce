name: Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Signed APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using pre-installed Android SDK at $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Decode permanent release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for CI release builds."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-app/release.keystore
          if [ ! -s android-app/release.keystore ]; then
            echo "::error::Decoded android-app/release.keystore is empty."
            exit 1
          fi
          echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
          echo "Decoded permanent release keystore to android-app/release.keystore"

      - name: Compute version metadata
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 10 ))
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Building versionName=${VERSION_NAME} (versionCode=${VERSION_CODE})"

      - name: Build Android GitHub-Flavor Release APK
        working-directory: android-app
        env:
          CI: "true"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STORE_ID: ${{ vars.STORE_ID }}
          WEB_STORE_BASE_URL: ${{ secrets.WEB_STORE_BASE_URL || vars.WEB_STORE_BASE_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            --no-daemon

      - name: Verify APK signature & generate release-meta.json
        run: |
          APK_SOURCE=$(find android-app/app/build/outputs/apk/github/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "::error::No githubRelease APK found!"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "Verifying APK signature with $APKSIGNER..."
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_SOURCE")
          echo "$CERT_OUTPUT"

          if echo "$CERT_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with Android Debug keystore! Refusing to publish."
            exit 1
          fi
          if ! echo "$CERT_OUTPUT" | grep -Eq "CN=(WhiteLabelCommerce|NovaStore)"; then
            echo "::error::APK signer certificate does not match expected permanent release certificate."
            exit 1
          fi

          mkdir -p dist
          APK_FILENAME="WhiteLabelCommerce-v${VERSION_NAME}-release.apk"
          RELEASE_APK="dist/${APK_FILENAME}"
          cp "$APK_SOURCE" "$RELEASE_APK"

          APK_SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          COMMIT_NOTES=$(git log -1 --pretty=%s)

          python3 - "$VERSION_CODE" "$VERSION_NAME" "$APK_FILENAME" "$APK_SHA256" "$COMMIT_NOTES" << 'PY' > dist/release-meta.json
          import json, sys
          meta = {
              "versionCode": int(sys.argv[1]),
              "versionName": sys.argv[2],
              "apkName": sys.argv[3],
              "sha256": sys.argv[4],
              "notes": sys.argv[5],
          }
          print(json.dumps(meta, indent=2, ensure_ascii=False))
          PY

          cat dist/release-meta.json
          echo "RELEASE_APK=${RELEASE_APK}" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_APK" dist/release-meta.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: WhiteLabelCommerce v${{ env.VERSION_NAME }}
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ env.RELEASE_APK }}
            dist/release-meta.json
