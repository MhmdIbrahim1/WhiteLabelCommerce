<!doctype html>
<html lang="ar" dir="rtl">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
  <body style="margin:0;padding:24px;background:#f4f4f5;color:#111315;font:16px/1.8 Arial,sans-serif">
    <main style="max-width:460px;margin:0 auto;padding:24px;background:#ffffff;border:1px solid #dadbdd;border-radius:16px">
      <p lang="ar" dir="rtl">استخدم هذا الرمز لتغيير كلمة المرور. صالح لمدة عشر دقائق.</p>
      <p lang="en" dir="ltr">Use this code to reset your password. It expires in 10 minutes.</p>
      <p dir="ltr" style="text-align:center;font:700 32px/1.5 monospace;font-variant-numeric:tabular-nums"><bdi dir="ltr">{{ .Token }}</bdi></p>
      <p style="text-align:center"><a style="color:#111315" href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery"><span lang="ar">تغيير كلمة المرور</span> · <span lang="en" dir="ltr">Reset password</span></a></p>
      <p lang="ar" dir="rtl">إذا لم تطلب هذا الرمز، يمكنك تجاهل الرسالة.</p>
      <p lang="en" dir="ltr">If you didn’t request this code, you can ignore this email.</p>
    </main>
  </body>
</html>
